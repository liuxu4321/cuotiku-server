# 生产环境配置（sealos 容器）
# JWT_SECRET、ADMIN_PHONE、ADMIN_PASSWORD、MYSQL_HOST、MYSQL_USERNAME、MYSQL_PASSWORD
# 无默认值，必须通过环境变量注入，缺失时启动失败
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:yycuotiku}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai&useSSL=${MYSQL_USE_SSL:false}&allowPublicKeyRetrieval=${MYSQL_ALLOW_PUBLIC_KEY_RETRIEVAL:true}
    username: ${MYSQL_USERNAME}
    password: ${MYSQL_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      pool-name: mysql-pool

app:
  jwt:
    secret: ${JWT_SECRET}
    ttl-hours: ${JWT_TTL_HOURS:2}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  admin:
    phone: ${ADMIN_PHONE}
    password: ${ADMIN_PASSWORD}
  cos:
    bucket: ${COS_BUCKET:cuotiji-1257458058}
    secret-id: ${COS_SECRET_ID:${TENCENT_SECRET_ID:}}
    secret-key: ${COS_SECRET_KEY:${TENCENT_SECRET_KEY:}}
  ai:
    tencent:
      # 可留空，部署后在环境变量中补充即可启用 AI 去手写
      secret-id: ${TENCENT_SECRET_ID:}
      secret-key: ${TENCENT_SECRET_KEY:}

logging:
  level:
    root: INFO
    com.yingying.cuotiku: INFO
