# 开发/测试环境配置（默认激活）
# 本地需先启动 MySQL，例如：
# docker run -d --name yyc-mysql -p 3306:3306 \
#   -e MYSQL_ROOT_PASSWORD=root123456 -e MYSQL_DATABASE=yycuotiku mysql:8.0
spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:yycuotiku}?useUnicode=true&characterEncoding=UTF-8&connectionTimeZone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      pool-name: mysql-pool

app:
  jwt:
    # 开发用默认密钥，生产环境请勿使用
    secret: ${JWT_SECRET:yy-cuotiku-server-dev-secret-key-do-not-use-in-production-0123456789}
    ttl-hours: ${JWT_TTL_HOURS:2}
    refresh-ttl-days: ${JWT_REFRESH_TTL_DAYS:30}
  admin:
    # 首次启动自动创建的管理员账号
    phone: ${ADMIN_PHONE:13800000000}
    password: ${ADMIN_PASSWORD:admin123456}
  cos:
    # bucket 配置后启用腾讯云COS存储；否则回退到 local-dir 本地目录（仅限开发）
    bucket: ${COS_BUCKET:cuotiji-1257458058}
    secret-id: ${COS_SECRET_ID:${TENCENT_SECRET_ID:}}
    secret-key: ${COS_SECRET_KEY:${TENCENT_SECRET_KEY:}}
  ai:
    tencent:
      secret-id: ${TENCENT_SECRET_ID:}
      secret-key: ${TENCENT_SECRET_KEY:}

logging:
  level:
    root: INFO
    com.yingying.cuotiku: DEBUG
